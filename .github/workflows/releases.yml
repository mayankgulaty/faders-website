# Adds each new App Store release of Faders to faders.app/updates (from Apple's public lookup).
# Cloudflare publishes every push to main.
name: Releases
on:
  schedule:
    - cron: "23 */3 * * *"   # every three hours
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_releases.py
      - name: Commit if anything changed
        run: |
          git config user.name "faders-pages-bot"
          git config user.email "faders-pages-bot@users.noreply.github.com"
          git add updates.html
          git diff --cached --quiet || git commit -m "Updates: new App Store release"
          git push
